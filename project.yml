name: AugramX
options:
  bundleIdPrefix: com.augramx
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
configs:
  Debug: debug
  Release: release

settings:
  base:
    ENABLE_PREVIEWS: YES
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    OTHER_SWIFT_FLAGS: "$(inherited)"
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/Frameworks"
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    AD_HOC_CODE_SIGNING_ALLOWED: YES
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      API_ID: "123456"
      API_HASH: "debug_hash_placeholder"
    Release:
      API_ID: "$(API_ID)"
      API_HASH: "$(API_HASH)"

targets:
  AugramX:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
        excludes:
          - "Info.plist"
    resources:
      - path: Resources
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.augramx.telegramclient
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ENABLE_BITCODE: NO
        OTHER_LDFLAGS: "$(inherited) -framework TDLibFramework -lc++ -lz"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        AD_HOC_CODE_SIGNING_ALLOWED: YES
    dependencies:
      - target: Design
      - target: Core
      - target: ViewModels
      - target: Views
      - framework: Frameworks/TDLibFramework.xcframework
        embed: true
        codeSignOnCopy: false

  Core:
    type: framework
    platform: iOS
    sources: [Sources/Core]
    settings:
      base:
        OTHER_LDFLAGS: "$(inherited) -framework TDLibFramework -lc++ -lz"

  Design:
    type: framework
    platform: iOS
    sources: [Sources/Design]

  ViewModels:
    type: framework
    platform: iOS
    sources: [Sources/ViewModels]
    dependencies:
      - target: Core
      - target: Design

  Views:
    type: framework
    platform: iOS
    sources: [Sources/Views]
    dependencies:
      - target: Design
      - target: Core
      - target: ViewModels

preBuildScripts:
  - name: Check TDLib XCFramework
    script: |
      #!/bin/bash
      if [ ! -d "${PROJECT_DIR}/Frameworks/TDLibFramework.xcframework" ]; then
        echo "error: TDLibFramework.xcframework is missing in ${PROJECT_DIR}/Frameworks/."
        echo "Please place TDLibFramework.xcframework in Frameworks/ or set TDLIB_XCFRAMEWORK_PATH before building."
        exit 1
      fi
